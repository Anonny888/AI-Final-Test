<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Final Quiz</title>
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085;
  --primary:#2563eb; --primary2:#1d4ed8; --ok:#15803d; --bad:#dc2626;
  --border:#e5e7eb; --shadow:0 8px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.55}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:28px 18px}
.wrap{max-width:1050px;margin:auto;padding:0 16px}
h1{margin:0 0 5px;font-size:30px} .sub{opacity:.9}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.94);backdrop-filter:blur(8px);padding:12px 0;border-bottom:1px solid var(--border)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}
.primary{background:var(--primary);color:white} .primary:hover{background:var(--primary2)}
.secondary{background:white;color:var(--text);border:1px solid var(--border)}
select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:white}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}
.progress > div{height:100%;background:#22c55e;width:0;transition:.25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin:18px 0}
.chapter{font-weight:800;color:#4f46e5;font-size:14px;margin-bottom:7px}
.qtitle{font-size:19px;font-weight:750;margin-bottom:16px}
.qimage{display:block;max-width:100%;width:min(850px,100%);margin:12px auto 20px;border-radius:12px;border:1px solid var(--border)}
.options{display:grid;gap:10px}
.option{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:#fff;transition:.15s}
.option:hover{border-color:#93c5fd;background:#eff6ff}
.option input{margin-top:5px;accent-color:var(--primary)}
.option.correct{border-color:#86efac;background:#f0fdf4}
.option.wrong{border-color:#fca5a5;background:#fef2f2}
.result{display:none;background:white;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin:20px 0}
.score{font-size:40px;font-weight:900;color:var(--primary)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 20px}
.stat{padding:12px 15px;background:#f8fafc;border-radius:12px;border:1px solid var(--border)}
.review{padding:15px;border-radius:12px;margin:10px 0;border:1px solid #fecaca;background:#fff7f7}
.review b{color:var(--bad)} .self{background:#fffbeb;border-color:#fde68a}
.hidden{display:none}
footer{text-align:center;color:var(--muted);padding:35px 0}
@media(max-width:600px){h1{font-size:24px}.card{padding:16px}.qtitle{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>AI Final Quiz</h1>
    <div class="sub">แบบฝึกทำข้อสอบ AI — ทำซ้ำได้ไม่จำกัด พร้อมตรวจคะแนนและข้อที่ผิด</div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="controls">
      <select id="chapterFilter"></select>
      <button class="secondary" id="shuffleBtn">🔀 สุ่มข้อ/ตัวเลือกใหม่</button>
      <button class="secondary" id="topBtn">⬆ กลับด้านบน</button>
      <span id="countText" style="color:#667085;font-weight:650"></span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
</div>

<main class="wrap">
  <div id="quiz"></div>
  <section id="result" class="result"></section>
  <div class="controls" style="justify-content:center;margin:20px 0 45px">
    <button class="primary" id="submitBtn">ส่งคำตอบ / ตรวจคะแนน</button>
    <button class="secondary" id="retryBtn">ทำใหม่อีกครั้ง</button>
  </div>
</main>

<footer>ข้อสอบอ้างอิงจากไฟล์ที่ผู้ใช้ให้มา • บทที่ 9 ข้อ 9 มีรูปโจทย์ประกอบ</footer>

const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const filterEl = document.getElementById('chapterFilter');
const countText = document.getElementById('countText');
const progressBar = document.getElementById('progressBar');

let questions = [];
let submitted = false;

const chapterOrder = [...new Map(ALL.map(q => [q.chapterId, q.chapter])).entries()];

function shuffle(a) {
  const x = [...a];
  for (let i=x.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function setupFilter() {
  filterEl.innerHTML = '<option value="all">ทุกบท</option>' +
    chapterOrder.map(([id,title]) => `<option value="${id}">${title}</option>`).join('');
}

function newAttempt() {
  submitted = false;
  resultEl.style.display='none';
  resultEl.innerHTML='';
  const selected = filterEl.value || 'all';
  let pool = selected === 'all' ? ALL : ALL.filter(q => q.chapterId === selected);
  questions = shuffle(pool).map(q => {
    const order = q.options.map((_,i)=>i);
    const shuffledOrder = shuffle(order);
    return {...q, displayOptions: shuffledOrder.map(i=>({text:q.options[i], original:i}))};
  });
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render() {
  quizEl.innerHTML='';
  questions.forEach((q, idx) => {
    const card=document.createElement('section');
    card.className='card';
    const selfAssessment = q.answer === null;
    card.innerHTML = `
      <div class="chapter">${q.chapter} • ข้อ ${q.number}</div>
      <div class="qtitle">${idx+1}. ${escapeHtml(q.question)}</div>
      ${q.image ? `<img class="qimage" src="${q.image}" alt="รูปโจทย์บทที่ 9 ข้อ 9 Feature Map calculation">` : ''}
      ${selfAssessment
        ? `<div class="self" style="padding:14px;border:1px solid #fde68a;border-radius:12px">ข้อนี้เป็นคำถามประเมินตนเอง และไม่มีคำตอบจากต้นฉบับ จึงไม่นำไปคิดคะแนน</div>`
        : `<div class="options">${q.displayOptions.map((o,j)=>`
          <label class="option">
            <input type="radio" name="q-${q.id}" value="${o.original}">
            <span><b>${j+1})</b> ${escapeHtml(o.text)}</span>
          </label>`).join('')}</div>`}
    `;
    quizEl.appendChild(card);
  });
  bindInputs();
  updateProgress();
  countText.textContent = `${questions.length} ข้อ • ${questions.filter(q=>q.answer!==null).length} ข้อที่มีคะแนน`;
}

function bindInputs() {
  quizEl.querySelectorAll('input[type=radio]').forEach(inp => inp.addEventListener('change', updateProgress));
}

function updateProgress() {
  const scorable=questions.filter(q=>q.answer!==null);
  const answered=scorable.filter(q=>document.querySelector(`input[name="q-${q.id}"]:checked`)).length;
  progressBar.style.width=(scorable.length ? answered/scorable.length*100 : 0)+'%';
}

function submitQuiz() {
  if (submitted) return;
  submitted=true;
  const scorable=questions.filter(q=>q.answer!==null);
  let score=0, unanswered=0, wrong=[];
  questions.forEach(q => {
    if(q.answer===null) return;
    const chosen=document.querySelector(`input[name="q-${q.id}"]:checked`);
    if(!chosen) { unanswered++; wrong.push({q, chosen:null}); return; }
    const val=Number(chosen.value);
    if(val===q.answer) score++;
    else wrong.push({q, chosen:val});
  });
  // Highlight answers
  questions.forEach(q=>{
    if(q.answer===null) return;
    q.displayOptions.forEach(o=>{
      const label=quizEl.querySelector(`input[name="q-${q.id}"][value="${o.original}"]`)?.closest('.option');
      if(!label) return;
      if(o.original===q.answer) label.classList.add('correct');
      const chosen=document.querySelector(`input[name="q-${q.id}"]:checked`);
      if(chosen && Number(chosen.value)===o.original && o.original!==q.answer) label.classList.add('wrong');
    });
  });
  wrong.forEach(w=>{
    const input=w.chosen===null ? null : document.querySelector(`input[name="q-${w.q.id}"][value="${w.chosen}"]`);
    if(input) input.closest('.option').classList.add('wrong');
  });

  const pct=scorable.length ? Math.round(score/scorable.length*100) : 0;
  let review='';
  if(wrong.length) {
    review = `<h3>ข้อที่ผิด / ไม่ได้ตอบ (${wrong.length} ข้อ)</h3>` +
      wrong.map((w,n)=>{
        const your = w.chosen===null ? 'ไม่ได้ตอบ' : `${w.q.options[w.chosen]}`;
        return `<div class="review"><b>${n+1}. ${w.q.chapter} • ข้อ ${w.q.number}</b><br>
        <strong>โจทย์:</strong> ${escapeHtml(w.q.question)}<br>
        <span style="color:#dc2626"><strong>คำตอบของคุณ:</strong> ${escapeHtml(your)}</span><br>
        <span style="color:#15803d"><strong>คำตอบที่ถูก:</strong> ${escapeHtml(w.q.options[w.q.answer])}</span></div>`;
      }).join('');
  } else {
    review='<div style="padding:15px;background:#f0fdf4;border:1px solid #86efac;border-radius:12px">🎉 ถูกทุกข้อที่มีคะแนน!</div>';
  }
  const selfCount=questions.filter(q=>q.answer===null).length;
  resultEl.innerHTML=`
    <div class="score">${score} / ${scorable.length}</div>
    <div class="stats">
      <div class="stat"><b>คะแนน</b><br>${pct}%</div>
      <div class="stat"><b>ถูก</b><br>${score} ข้อ</div>
      <div class="stat"><b>ผิด/ไม่ตอบ</b><br>${wrong.length} ข้อ</div>
      ${selfCount ? `<div class="stat"><b>ไม่คิดคะแนน</b><br>${selfCount} ข้อ</div>` : ''}
    </div>
    ${review}
  `;
  resultEl.style.display='block';
  resultEl.scrollIntoView({behavior:'smooth',block:'start'});
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

setupFilter();
filterEl.addEventListener('change', newAttempt);
document.getElementById('shuffleBtn').addEventListener('click', newAttempt);
document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', newAttempt);
document.getElementById('topBtn').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
newAttempt();
</script>
</body>
